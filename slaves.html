<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RO Real-Monster Slave Summons (Pre-Renewal &amp; Renewal)</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1a2333;
      --border: #263248;
      --text: #e6edf7;
      --muted: #93a4be;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --gold: #fbbf24;
      --gold-soft: rgba(251, 191, 36, 0.15);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.14);
      --purple: #c084fc;
      --purple-soft: rgba(192, 132, 252, 0.14);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
    header {
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 2.5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .controls {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .segmented {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      flex-wrap: wrap;
    }
    .segmented button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .segmented button.active {
      background: var(--accent);
      color: #08101c;
    }
    .search-wrap {
      position: relative;
      flex: 1 1 260px;
      min-width: 200px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 34px 9px 12px;
      font-size: 0.92rem;
      outline: none;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
    }
    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      padding: 2px 6px;
    }
    .clear-btn.visible { display: block; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .stats {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .stats strong { color: var(--text); }

    /* Desktop Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    thead th {
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: left;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-ind { margin-left: 4px; opacity: 0.7; }
    tbody tr {
      border-bottom: 1px solid rgba(38, 50, 72, 0.65);
      transition: background 0.12s ease;
    }
    tbody tr:last-child { border-bottom: 0; }
    tbody tr:hover { background: rgba(96, 165, 250, 0.05); }
    td {
      padding: 11px 14px;
      vertical-align: middle;
    }

    .mob-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .mob-top {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mob-name { font-weight: 600; color: var(--text); }
    .mob-meta {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .id-pill {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.75rem;
      padding: 1px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .id-pill:hover { border-color: var(--accent); color: var(--text); }
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .badge-mvp { background: var(--gold-soft); color: var(--gold); }
    .badge-both { background: var(--green-soft); color: var(--green); }
    .badge-pre { background: var(--amber-soft); color: var(--amber); }
    .badge-re { background: var(--purple-soft); color: var(--purple); }
    .badge-ring { background: var(--accent-soft); color: var(--accent); }
    .card-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(251, 191, 36, 0.09);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fde68a;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .card-pill:hover { border-color: var(--gold); }
    .card-rate {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
    }

    /* Mobile Cards */
    .cards-list {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .m-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .m-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .m-arrow {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .m-card-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid rgba(38, 50, 72, 0.65);
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1f2937;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 50;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 768px) {
      .table-wrap { display: none; }
      .cards-list { display: flex; }
      .stats { margin-left: 0; width: 100%; }
      .segmented { width: 100%; }
      .segmented button { flex: 1; text-align: center; padding: 8px 6px; font-size: 0.82rem; }
    }
  </style>
</head>

    <div class="cards-list" id="cardsList"></div>
    <div class="empty" id="emptyState" style="display:none;">No matching monsters found.</div>
  </div>

e": true, "availability": "re-only"}, {"casterId": 2884, "casterName": "Bigfoot Ringleader", "casterSprite": "C3_BIGFOOT", "casterLv": 29, "casterMvp": false, "category": "ringleader", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 1060, "targetName": "Bigfoot", "targetSprite": "BIGFOOT", "targetLv": 29, "cards": [{"name": "BigFoot Card", "raw": "BigFoot_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 2889, "casterName": "Assaulter Ringleader", "casterSprite": "C3_ASSULTER", "casterLv": 100, "casterMvp": false, "category": "ringleader", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 1315, "targetName": "Assaulter", "targetSprite": "ASSULTER", "targetLv": 100, "cards": [{"name": "Assulter Card", "raw": "Assulter_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 2894, "casterName": "Arclouze Ringleader", "casterSprite": "C3_ARCLOUSE", "casterLv": 107, "casterMvp": false, "category": "ringleader", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 1194, "targetName": "Arclouse", "targetSprite": "ARCLOUSE", "targetLv": 107, "cards": [{"name": "Arclouse Card", "raw": "Arclouse_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 2903, "casterName": "Ancient Mimic Ringleader", "casterSprite": "C3_ANCIENT_MIMIC", "casterLv": 112, "casterMvp": false, "category": "ringleader", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 1699, "targetName": "Ancient Mimic", "targetSprite": "ANCIENT_MIMIC", "targetLv": 112, "cards": [{"name": "Ancient Mimic Card", "raw": "Ancient_Mimic_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 2908, "casterName": "Aliza Ringleader", "casterSprite": "C3_ALIZA", "casterLv": 112, "casterMvp": false, "category": "ringleader", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 1737, "targetName": "Aliza", "targetSprite": "ALIZA", "targetLv": 112, "cards": [{"name": "Aliza Card", "raw": "Aliza_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 2913, "casterName": "Acidus Ringleader", "casterSprite": "C3_ACIDUS_", "casterLv": 130, "casterMvp": false, "category": "ringleader", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 1716, "targetName": "Acidus", "targetSprite": "ACIDUS_", "targetLv": 130, "cards": [{"name": "Acidus  Card", "raw": "Acidus__Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 2923, "casterName": "Owl Marquis", "casterSprite": "OWL_MARQUEES", "casterLv": 170, "casterMvp": false, "category": "standard", "skill": "NPC_SUMMONSLAVE", "summonCount": 2, "targetId": 2921, "targetName": "Owl Viscount", "targetSprite": "OWL_VISCOUNT", "targetLv": 168, "cards": [{"name": "Owl Viscount Card", "raw": "Owl_Viscount_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}, {"casterId": 3074, "casterName": "Time Holder", "casterSprite": "TIMEHOLDER", "casterLv": 170, "casterMvp": true, "category": "standard", "skill": "NPC_SUMMONSLAVE", "summonCount": 5, "targetId": 2917, "targetName": "Big Bell", "targetSprite": "BIG_BELL", "targetLv": 163, "cards": [{"name": "Big Bell Card", "raw": "Big_Bell_Card", "rate": 1}], "inPre": false, "inRe": true, "availability": "re-only"}];

    const state = {
      mode: 'pre',       // 'pre' | 're' | 'diff'
      cat: 'all',        // 'all' | 'standard' | 'ringleader' | 'event'
      mvpOnly: false,
      query: '',
      sortKey: 'casterId',
      sortDir: 'asc'
    };

    const tableBody = document.getElementById('tableBody');
    const cardsList = document.getElementById('cardsList');
    const emptyState = document.getElementById('emptyState');
    const statsText = document.getElementById('statsText');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const mvpOnlyBtn = document.getElementById('mvpOnlyBtn');
    const toast = document.getElementById('toast');

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied: ' + text));
      } else {
        showToast(text);
      }
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function availBadge(avail) {
      if (avail === 'both') return '<span class="badge badge-both">Pre-Re &amp; Re</span>';
      if (avail === 'pre-only') return '<span class="badge badge-pre">Pre-Re Only</span>';
      return '<span class="badge badge-re">Renewal Only</span>';
    }

    function filterData() {
      const q = state.query.trim().toLowerCase();
      return DATA.filter(r => {
        if (state.mode === 'pre' && !r.inPre) return false;
        if (state.mode === 're' && !r.inRe) return false;
        if (state.mode === 'diff' && r.availability === 'both') return false;
        if (state.cat !== 'all' && r.category !== state.cat) return false;
        if (state.mvpOnly && !r.casterMvp) return false;
        if (q) {
          const hay = [
            r.casterId, r.casterName, r.casterSprite,
            r.targetId, r.targetName, r.targetSprite,
            ...r.cards.map(c => c.name + ' ' + c.raw)
          ].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => {
        let va, vb;
        if (state.sortKey === 'card') {
          va = a.cards[0]?.name || '';
          vb = b.cards[0]?.name || '';
        } else {
          va = a[state.sortKey];
          vb = b[state.sortKey];
        }
        if (typeof va === 'number' && typeof vb === 'number') {
          return state.sortDir === 'asc' ? va - vb : vb - va;
        }
        return state.sortDir === 'asc'
          ? String(va).localeCompare(String(vb))
          : String(vb).localeCompare(String(va));
      });
    }

    function render() {
      const rows = filterData();
      const uniqueCasters = new Set(rows.map(r => r.casterId)).size;
      const uniqueTargets = new Set(rows.map(r => r.targetId)).size;
      statsText.innerHTML = `<strong>${rows.length}</strong> pairs · <strong>${uniqueCasters}</strong> casters · <strong>${uniqueTargets}</strong> real mobs`;

      document.querySelectorAll('thead th').forEach(th => {
        const ind = th.querySelector('.sort-ind');
        if (th.dataset.sort === state.sortKey) {
          ind.textContent = state.sortDir === 'asc' ? '▲' : '▼';
        } else {
          ind.textContent = '';
        }
      });

      if (!rows.length) {
        tableBody.innerHTML = '';
        cardsList.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      tableBody.innerHTML = rows.map(r => `
        <tr>
          <td>
            <div class="mob-cell">
              <div class="mob-top">
                <span class="id-pill" data-copy="${r.casterId}" title="Copy ID">${r.casterId}</span>
                <span class="mob-name">${esc(r.casterName)}</span>
                ${r.casterMvp ? '<span class="badge badge-mvp">MVP</span>' : ''}
                ${r.category === 'ringleader' ? '<span class="badge badge-ring">Ringleader</span>' : ''}
              </div>
              <span class="mob-meta">${esc(r.casterSprite)} · Lv ${r.casterLv}</span>
            </div>
          </td>
          <td>
            <div class="mob-cell">
              <div class="mob-top">
                <span class="id-pill" data-copy="${r.targetId}" title="Copy ID">${r.targetId}</span>
                <span class="mob-name">${esc(r.targetName)}</span>
              </div>
              <span class="mob-meta">${esc(r.targetSprite)} · Lv ${r.targetLv}</span>
            </div>
          </td>
          <td>
            ${r.cards.map(c => `
              <span class="card-pill" data-copy="${esc(c.raw)}" title="Copy item name">
                ${esc(c.name)}
                <span class="card-rate">${(c.rate / 100).toFixed(2)}%</span>
              </span>
            `).join(' ')}
          </td>
          <td><span class="mob-meta">Lv ${r.summonCount}</span></td>
          <td>${availBadge(r.availability)}</td>
        </tr>
      `).join('');

      cardsList.innerHTML = rows.map(r => `
        <article class="m-card">
          <div class="m-card-head">
            <div class="mob-cell">
              <div class="mob-top">
                <span class="id-pill" data-copy="${r.casterId}">${r.casterId}</span>
                <span class="mob-name">${esc(r.casterName)}</span>
                ${r.casterMvp ? '<span class="badge badge-mvp">MVP</span>' : ''}
              </div>
              <span class="mob-meta">${esc(r.casterSprite)} · Lv ${r.casterLv}</span>
            </div>
            ${availBadge(r.availability)}
          </div>
          <div class="m-arrow">↳ Summons (Skill Lv ${r.summonCount})</div>
          <div class="mob-cell">
            <div class="mob-top">
              <span class="id-pill" data-copy="${r.targetId}">${r.targetId}</span>
              <span class="mob-name">${esc(r.targetName)}</span>
            </div>
            <span class="mob-meta">${esc(r.targetSprite)} · Lv ${r.targetLv}</span>
          </div>
          <div class="m-card-foot">
            <div>
              ${r.cards.map(c => `
                <span class="card-pill" data-copy="${esc(c.raw)}">
                  ${esc(c.name)}
                  <span class="card-rate">${(c.rate / 100).toFixed(2)}%</span>
                </span>
              `).join(' ')}
            </div>
            ${r.category === 'ringleader' ? '<span class="badge badge-ring">Ringleader</span>' : ''}
          </div>
        </article>
      `).join('');
    }

    document.querySelectorAll('.segmented button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
        render();
      });
    });

    document.querySelectorAll('.chip[data-cat]').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip[data-cat]').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.cat = chip.dataset.cat;
        render();
      });
    });

    mvpOnlyBtn.addEventListener('click', () => {
      state.mvpOnly = !state.mvpOnly;
      mvpOnlyBtn.classList.toggle('active', state.mvpOnly);
      render();
    });

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      clearSearch.classList.toggle('visible', state.query.length > 0);
      render();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      clearSearch.classList.remove('visible');
      render();
      searchInput.focus();
    });

    document.querySelectorAll('thead th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortKey = key;
          state.sortDir = 'asc';
        }
        render();
      });
    });

    document.addEventListener('click', e => {
      const el = e.target.closest('[data-copy]');
      if (el) copyText(el.dataset.copy);
    });

    render();
  </script>
</body>
</html>
